[project]
name = "axis"
version = "0.1.0"
description = "Axis — the local-first, voice-first AI operating system for Pivot"
requires-python = ">=3.10"
dependencies = [
    "OpenJarvis",
    "elevenlabs>=1.0",
    "pvporcupine>=3.0",
    "python-dotenv>=1.0",
    # Phase 2 — memory
    "supabase>=2.0",
    "httpx>=0.27",
    # Phase 3 — Microsoft Graph
    "msal>=1.28",
    # Phase 5 — Cloud fallback
    "anthropic>=0.40",
    "sounddevice>=0.5.5",
    "faster-whisper>=1.2.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
speech = ["sherpa-onnx"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0", "pdfplumber>=0.10"]
memory = ["faiss-cpu", "sentence-transformers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory", "skills", "vault", "speech", "connectors", "intelligence", "server"]
