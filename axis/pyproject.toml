[project]
name = "axis"
version = "0.1.0"
description = "Axis — the local-first, voice-first AI operating system for Pivot"
requires-python = ">=3.10"
dependencies = [
    "OpenJarvis",
    "elevenlabs>=1.0",
    "pvporcupine>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
speech = ["sherpa-onnx"]
server = ["fastapi", "uvicorn"]
memory = ["faiss-cpu", "sentence-transformers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
