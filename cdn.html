<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script id="game-source" type="text/game-tsx">
      // Pull React hooks from the UMD global (replaces the ES module import)
      const { useEffect, useMemo, useRef, useState } = React;

      // ─── Types ──────────────────────────────────────────────────────────────
      type Vec2 = { x: number; y: number };
      type GestureType =
        | "none" | "cross_left" | "cross_right"
        | "between_left" | "between_right"
        | "behind_left" | "behind_right" | "shot_start";
      type MoveState = "idle" | "dribble" | "gather" | "shooting" | "recovery";
      type BallHand = "left" | "right";
      type TrailPoint = { x: number; y: number; t: number };
      type GamePhase = "menu" | "playing" | "gameover";
      type Particle = {
        x: number; y: number; vx: number; vy: number;
        life: number; maxLife: number; color: string; size: number;
        rotation: number; rotSpeed: number; type: "confetti" | "spark";
      };
      type ScorePopup = { x: number; y: number; text: string; life: number; vy: number };
      type PlayerState = {
        pos: Vec2; vel: Vec2; facing: number; stamina: number; ballHand: BallHand;
        moveState: MoveState; dribblePhase: number; shotMeter: number;
        shotHolding: boolean; shotReleasedAt: number | null;
        flash: number; currentMoveLabel: string; moveTimer: number;
      };
      type DefenderState = {
        pos: Vec2; vel: Vec2; facing: number; contesting: boolean; contestTimer: number;
      };
      type BallFlight = {
        active: boolean; t: number; duration: number;
        p0: Vec2; p1: Vec2; p2: Vec2;
        quality: number; isThree: boolean; madeShot: boolean;
      };
      type GestureResult = { type: GestureType; confidence: number; debug: string };

      // ─── Constants ───────────────────────────────────────────────────────────
      const COURT_W = 1000;
      const COURT_H = 1600;
      const JOYSTICK_RADIUS = 72;
      const MAX_TRAIL = 28;
      const FIXED_STEP = 1 / 120;
      const MAX_DT = 1 / 20;
      const BASKET_WORLD: Vec2 = { x: 500, y: 210 };
      const THREE_PT_DIST = 400;
      const GAME_DURATION = 90;
      const SHOT_CLOCK = 24;

      // ─── Math Utils ──────────────────────────────────────────────────────────
      const clamp = (v: number, lo: number, hi: number) => Math.max(lo, Math.min(hi, v));
      const lerp = (a: number, b: number, t: number) => a + (b - a) * t;
      const normalize = (v: Vec2): Vec2 => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; };
      const sub = (a: Vec2, b: Vec2): Vec2 => ({ x: a.x-b.x, y: a.y-b.y });
      const add = (a: Vec2, b: Vec2): Vec2 => ({ x: a.x+b.x, y: a.y+b.y });
      const mul = (a: Vec2, s: number): Vec2 => ({ x: a.x*s, y: a.y*s });
      const vdist = (a: Vec2, b: Vec2) => Math.hypot(a.x-b.x, a.y-b.y);

      function rrect(ctx: CanvasRenderingContext2D, x: number, y: number, w: number, h: number, r: number) {
        const rr = Math.min(r, w*0.5, h*0.5);
        ctx.beginPath();
        ctx.moveTo(x+rr, y);
        ctx.arcTo(x+w, y, x+w, y+h, rr);
        ctx.arcTo(x+w, y+h, x, y+h, rr);
        ctx.arcTo(x, y+h, x, y, rr);
        ctx.arcTo(x, y, x+w, y, rr);
        ctx.closePath();
      }

      function bezier(p0: Vec2, p1: Vec2, p2: Vec2, t: number): Vec2 {
        const t1 = 1 - t;
        return { x: t1*t1*p0.x + 2*t1*t*p1.x + t*t*p2.x, y: t1*t1*p0.y + 2*t1*t*p1.y + t*t*p2.y };
      }

      function isInsideThree(pos: Vec2): boolean { return vdist(pos, BASKET_WORLD) < THREE_PT_DIST; }

      // ─── Gesture Classifier ──────────────────────────────────────────────────
      function classifyGesture(points: TrailPoint[]): GestureResult {
        if (points.length < 4) return { type: "none", confidence: 0, debug: "too_few" };
        const start = points[0], end = points[points.length-1];
        const delta = { x: end.x-start.x, y: end.y-start.y };
        const dist2 = Math.hypot(delta.x, delta.y);
        const duration = Math.max(1, end.t-start.t);
        const vx = delta.x/duration, vy = delta.y/duration;
        const absX = Math.abs(delta.x), absY = Math.abs(delta.y);
        let signedCurvature = 0;
        for (let i = 1; i < points.length-1; i++) {
          const a = sub(points[i], points[i-1]), b = sub(points[i+1], points[i]);
          signedCurvature += a.x*b.y - a.y*b.x;
        }
        const upward = delta.y < -56 && absY > absX*1.05;
        const curvedEnough = Math.abs(signedCurvature) > 1800 && dist2 > 56;
        const diagDownRight = delta.x > 36 && delta.y > 32;
        const diagDownLeft = delta.x < -36 && delta.y > 32;
        const strongHorizontal = absX > 48 && absX > absY*1.3;
        if (upward && Math.abs(vy) > 0.5) return { type: "shot_start", confidence: 0.95, debug: "up_swipe" };
        if (curvedEnough) return delta.x > 0 ? { type: "behind_right", confidence: 0.82, debug: "curve+" } : { type: "behind_left", confidence: 0.82, debug: "curve-" };
        if (diagDownRight) return { type: "between_right", confidence: 0.84, debug: "diag_r" };
        if (diagDownLeft) return { type: "between_left", confidence: 0.84, debug: "diag_l" };
        if (strongHorizontal) {
          if (delta.x > 0 && Math.abs(vx) > 0.5) return { type: "cross_right", confidence: 0.9, debug: "horiz_r" };
          if (delta.x < 0 && Math.abs(vx) > 0.5) return { type: "cross_left", confidence: 0.9, debug: "horiz_l" };
        }
        return { type: "none", confidence: 0.2, debug: "unknown" };
      }

      function useDevicePixelRatio() {
        const [dpr, setDpr] = useState(1);
        useEffect(() => {
          const update = () => setDpr(Math.min(window.devicePixelRatio || 1, 3));
          update();
          window.addEventListener("resize", update);
          return () => window.removeEventListener("resize", update);
        }, []);
        return dpr;
      }

      // ─── Main Component ──────────────────────────────────────────────────────
      function BasketballGame() {
        const canvasRef = useRef<HTMLCanvasElement | null>(null);
        const wrapRef = useRef<HTMLDivElement | null>(null);
        const dpr = useDevicePixelRatio();

        const [uiStats, setUiStats] = useState({
          fps: 0, score: 0, timeLeft: GAME_DURATION,
          phase: "menu" as GamePhase, move: "Idle", shot: "--",
        });

        const simRef = useRef({
          phase: "menu" as GamePhase,
          score: 0, timeLeft: GAME_DURATION, shotClock: SHOT_CLOCK, justStarted: false,
          player: {
            pos: { x: COURT_W*0.5, y: COURT_H*0.68 }, vel: { x: 0, y: 0 },
            facing: -Math.PI/2, stamina: 1, ballHand: "right" as BallHand,
            moveState: "idle" as MoveState, dribblePhase: 0, shotMeter: 0,
            shotHolding: false, shotReleasedAt: null as number|null,
            flash: 0, currentMoveLabel: "Idle", moveTimer: 0,
          } as PlayerState,
          defender: {
            pos: { x: COURT_W*0.52, y: COURT_H*0.44 }, vel: { x: 0, y: 0 },
            facing: Math.PI/2, contesting: false, contestTimer: 0,
          } as DefenderState,
          ballFlight: {
            active: false, t: 0, duration: 0,
            p0: { x:0,y:0 }, p1: { x:0,y:0 }, p2: { x:0,y:0 },
            quality: 0, isThree: false, madeShot: false,
          } as BallFlight,
          particles: [] as Particle[],
          scorePopups: [] as ScorePopup[],
          joystickOrigin: { x: 120, y: 1320 } as Vec2,
          joystickKnob: { x: 120, y: 1320 } as Vec2,
          moveInput: { x: 0, y: 0 } as Vec2,
          pointerMap: new Map<number, Vec2>(),
          leftStickId: null as number|null,
          gestureId: null as number|null,
          gestureTrail: [] as TrailPoint[],
          gestureDebug: "—",
          accumulator: 0, lastTime: 0,
          fpsSamples: [] as number[],
          arenaW: 0, arenaH: 0,
        });

        const CONFETTI_COLORS = useMemo(
          () => ["#ff4444","#00d4ff","#ffd700","#44ff88","#ff88ff","#ff8800","#ffffff"], []
        );

        useEffect(() => {
          const canvas = canvasRef.current, wrap = wrapRef.current;
          if (!canvas || !wrap) return;
          const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
          if (!ctx) return;
          const sim = simRef.current;

          const resize = () => {
            const rect = wrap.getBoundingClientRect();
            const w = Math.floor(rect.width), h = Math.floor(rect.height);
            canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
            canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sim.arenaW = w; sim.arenaH = h;
          };
          resize();
          const ro = new ResizeObserver(resize);
          ro.observe(wrap);

          const toScreen = (w: Vec2): Vec2 => ({ x: (w.x/COURT_W)*sim.arenaW, y: (w.y/COURT_H)*sim.arenaH });
          const ws = (u: number) => u*(sim.arenaW/COURT_W);

          // Particles
          const emitScore = (sx: number, sy: number, isThree: boolean) => {
            for (let i = 0; i < (isThree ? 48 : 28); i++) {
              const angle = Math.random()*Math.PI*2, speed = 90+Math.random()*220;
              sim.particles.push({
                x:sx, y:sy, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-120,
                life:1, maxLife:0.9+Math.random()*0.4,
                color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
                size:5+Math.random()*7, rotation:Math.random()*Math.PI*2,
                rotSpeed:(Math.random()-0.5)*10, type:"confetti",
              });
            }
            for (let i = 0; i < 14; i++) {
              const angle = (i/14)*Math.PI*2;
              sim.particles.push({
                x:sx, y:sy, vx:Math.cos(angle)*140, vy:Math.sin(angle)*140,
                life:1, maxLife:0.5, color:"#ffd700", size:3,
                rotation:0, rotSpeed:0, type:"spark",
              });
            }
          };

          const addPopup = (wx: number, wy: number, text: string) => {
            const s = toScreen({ x:wx, y:wy });
            sim.scorePopups.push({ x:s.x, y:s.y, text, life:1.2, vy:-70 });
          };

          const launchShot = (quality: number) => {
            if (sim.ballFlight.active) return;
            const p = sim.player;
            const three = !isInsideThree(p.pos);
            const d = vdist(p.pos, BASKET_WORLD);
            const flightTime = 0.45 + d/1100;
            const midX = (p.pos.x+BASKET_WORLD.x)*0.5;
            const midY = Math.min(p.pos.y, BASKET_WORLD.y) - COURT_H*(0.22+quality*0.12);
            const delta = Math.abs(quality-0.68);
            let madeShot = false;
            if (delta < 0.05) madeShot = true;
            else if (delta < 0.13) madeShot = Math.random() < 0.52;
            sim.ballFlight = { active:true, t:0, duration:flightTime, p0:{...p.pos}, p1:{x:midX,y:midY}, p2:{...BASKET_WORLD}, quality, isThree:three, madeShot };
          };

          const resolveShot = () => {
            const bf = sim.ballFlight;
            if (!bf.madeShot) return;
            const pts = bf.isThree ? 3 : 2;
            sim.score += pts;
            sim.shotClock = SHOT_CLOCK;
            const bs = toScreen(BASKET_WORLD);
            emitScore(bs.x, bs.y, bf.isThree);
            addPopup(BASKET_WORLD.x, BASKET_WORLD.y-100, bf.isThree ? "+3" : "+2");
          };

          const triggerMove = (type: GestureType) => {
            const p = sim.player;
            if (type === "none" || sim.phase !== "playing") return;
            if (type === "shot_start") {
              p.moveState="gather"; p.shotHolding=true; p.shotMeter=0;
              p.currentMoveLabel="Loading…"; p.moveTimer=0.25; return;
            }
            p.moveState="dribble"; p.moveTimer=0.18; p.flash=1;
            switch(type) {
              case "cross_left":    p.ballHand="left";  p.currentMoveLabel="Crossover ←"; p.vel.x-=85; break;
              case "cross_right":   p.ballHand="right"; p.currentMoveLabel="Crossover →"; p.vel.x+=85; break;
              case "between_left":  p.ballHand="left";  p.currentMoveLabel="Btw Legs ←";  p.vel.x-=62; p.vel.y-=32; break;
              case "between_right": p.ballHand="right"; p.currentMoveLabel="Btw Legs →";  p.vel.x+=62; p.vel.y-=32; break;
              case "behind_left":   p.ballHand="left";  p.currentMoveLabel="Behind ←";    p.vel.x-=74; break;
              case "behind_right":  p.ballHand="right"; p.currentMoveLabel="Behind →";    p.vel.x+=74; break;
            }
          };

          const endShot = () => {
            const p = sim.player;
            if (!p.shotHolding) return;
            p.shotHolding=false; p.moveState="shooting";
            p.shotReleasedAt=p.shotMeter; p.moveTimer=0.32;
            p.currentMoveLabel="Release!"; p.flash=1;
            launchShot(p.shotMeter);
          };

          const getPoint = (e: PointerEvent): Vec2 => {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX-rect.left, y: e.clientY-rect.top };
          };

          const resetGame = () => {
            sim.phase="playing"; sim.score=0; sim.timeLeft=GAME_DURATION;
            sim.shotClock=SHOT_CLOCK; sim.particles=[]; sim.scorePopups=[];
            sim.ballFlight.active=false; sim.justStarted=true;
            const p=sim.player;
            p.pos={x:COURT_W*0.5,y:COURT_H*0.68}; p.vel={x:0,y:0};
            p.moveState="idle"; p.currentMoveLabel="Idle";
            p.shotHolding=false; p.shotReleasedAt=null; p.stamina=1; p.flash=0;
            sim.defender.pos={x:COURT_W*0.52,y:COURT_H*0.44};
            sim.defender.vel={x:0,y:0}; sim.moveInput={x:0,y:0};
          };

          const onPointerDown = (e: PointerEvent) => {
            const pt = getPoint(e);
            sim.pointerMap.set(e.pointerId, pt);
            canvas.setPointerCapture(e.pointerId);
            if (sim.phase==="menu"||sim.phase==="gameover") { resetGame(); return; }
            if (sim.justStarted) { sim.justStarted=false; return; }
            const leftZone = pt.x < sim.arenaW*0.42;
            if (leftZone && sim.leftStickId===null) {
              sim.leftStickId=e.pointerId; sim.joystickOrigin=pt; sim.joystickKnob=pt;
            } else if (!leftZone && sim.gestureId===null) {
              sim.gestureId=e.pointerId;
              sim.gestureTrail=[{x:pt.x,y:pt.y,t:performance.now()}];
            }
          };

          const onPointerMove = (e: PointerEvent) => {
            const pt = getPoint(e);
            sim.pointerMap.set(e.pointerId, pt);
            if (sim.leftStickId===e.pointerId) {
              const delta=sub(pt,sim.joystickOrigin), len=Math.hypot(delta.x,delta.y);
              const n=len>0?{x:delta.x/len,y:delta.y/len}:{x:0,y:0};
              sim.joystickKnob=len>JOYSTICK_RADIUS?add(sim.joystickOrigin,mul(n,JOYSTICK_RADIUS)):pt;
              sim.moveInput=len>8?n:{x:0,y:0};
            }
            if (sim.gestureId===e.pointerId) {
              sim.gestureTrail.push({x:pt.x,y:pt.y,t:performance.now()});
              if (sim.gestureTrail.length>MAX_TRAIL) sim.gestureTrail.shift();
              if (sim.player.shotHolding) {
                const depth=clamp((sim.gestureTrail[0].y-pt.y)/(sim.arenaH*0.18),0,1);
                sim.player.shotMeter=depth;
              }
            }
          };

          const onPointerUp = (e: PointerEvent) => {
            if (sim.leftStickId===e.pointerId) { sim.leftStickId=null; sim.moveInput={x:0,y:0}; sim.joystickKnob=sim.joystickOrigin; }
            if (sim.gestureId===e.pointerId) {
              if (sim.player.shotHolding) { endShot(); }
              else {
                const result=classifyGesture(sim.gestureTrail);
                sim.gestureDebug=result.type==="none"?"—":result.type.replace(/_/g," ");
                triggerMove(result.type);
              }
              sim.gestureId=null; sim.gestureTrail=[];
            }
            sim.pointerMap.delete(e.pointerId);
            try { canvas.releasePointerCapture(e.pointerId); } catch {}
          };

          const onPointerCancel = (e: PointerEvent) => onPointerUp(e);
          canvas.addEventListener("pointerdown", onPointerDown, { passive:false });
          canvas.addEventListener("pointermove", onPointerMove, { passive:true });
          canvas.addEventListener("pointerup", onPointerUp, { passive:true });
          canvas.addEventListener("pointercancel", onPointerCancel, { passive:true });

          // ── Simulation ─────────────────────────────────────────────────────
          const simulate = (dt: number) => {
            if (sim.phase!=="playing") return;
            const p=sim.player, def=sim.defender;
            sim.timeLeft=Math.max(0,sim.timeLeft-dt);
            sim.shotClock=Math.max(0,sim.shotClock-dt);
            if (sim.timeLeft<=0) { sim.phase="gameover"; return; }
            if (sim.shotClock<=0) sim.shotClock=SHOT_CLOCK;

            if (!p.shotHolding && p.moveState!=="shooting" && !sim.ballFlight.active) {
              p.vel.x+=sim.moveInput.x*450*dt;
              p.vel.y+=sim.moveInput.y*450*dt;
            }
            p.vel.x*=Math.exp(-8.8*dt); p.vel.y*=Math.exp(-8.8*dt);
            const spd=Math.hypot(p.vel.x,p.vel.y);
            if (spd>240) { const n=normalize(p.vel); p.vel=mul(n,240); }
            p.pos.x=clamp(p.pos.x+p.vel.x*dt,100,COURT_W-100);
            p.pos.y=clamp(p.pos.y+p.vel.y*dt,300,COURT_H-120);
            if (spd>3) p.facing=lerp(p.facing,Math.atan2(p.vel.y,p.vel.x),0.18);
            p.dribblePhase+=dt*(4+spd*0.026);
            p.flash=Math.max(0,p.flash-dt*3.5);
            p.moveTimer=Math.max(0,p.moveTimer-dt);
            if (p.shotHolding) { p.shotMeter=clamp(p.shotMeter+dt*0.32,0,1); p.currentMoveLabel="Shot Load"; }
            if (p.moveState==="shooting"&&p.moveTimer<=0) { p.moveState="recovery"; p.moveTimer=0.14; }
            else if (p.moveState==="recovery"&&p.moveTimer<=0) { p.moveState="idle"; p.currentMoveLabel=spd>10?"Move":"Idle"; }
            else if (p.moveState==="dribble"&&p.moveTimer<=0) { p.moveState="idle"; p.currentMoveLabel=spd>10?"Move":"Idle"; }
            else if (p.moveState==="gather"&&!p.shotHolding&&p.moveTimer<=0) p.moveState="idle";
            p.stamina=clamp(p.stamina-spd*0.00006*dt+0.045*dt,0.2,1);

            const toDef=sub(p.pos,def.pos), defDist=Math.hypot(toDef.x,toDef.y);
            const defSpeed=clamp(165+sim.score*1.8,165,250), desired=135;
            if (defDist>desired+25) { const n=normalize(toDef); def.vel.x=lerp(def.vel.x,n.x*defSpeed,dt*4.5); def.vel.y=lerp(def.vel.y,n.y*defSpeed,dt*4.5); }
            else if (defDist<desired-25) { const n=normalize(toDef); def.vel.x=lerp(def.vel.x,-n.x*defSpeed*0.5,dt*4); def.vel.y=lerp(def.vel.y,-n.y*defSpeed*0.5,dt*4); }
            else { def.vel.x=lerp(def.vel.x,p.vel.x*0.72,dt*3.5); def.vel.y=lerp(def.vel.y,p.vel.y*0.42,dt*3.5); }
            def.vel.x*=Math.exp(-5.5*dt); def.vel.y*=Math.exp(-5.5*dt);
            def.pos.x=clamp(def.pos.x+def.vel.x*dt,80,COURT_W-80);
            def.pos.y=clamp(def.pos.y+def.vel.y*dt,180,COURT_H-180);
            def.facing=lerp(def.facing,Math.atan2(p.pos.y-def.pos.y,p.pos.x-def.pos.x),dt*5.5);
            def.contesting=defDist<170&&p.moveState==="shooting";
            def.contestTimer=Math.max(0,def.contestTimer-dt);
            if (def.contesting) def.contestTimer=0.35;

            const bf=sim.ballFlight;
            if (bf.active) {
              bf.t+=dt/bf.duration;
              if (bf.t>=1) { bf.t=1; bf.active=false; resolveShot(); p.moveState="recovery"; p.moveTimer=0.4; }
            }

            for (let i=sim.particles.length-1;i>=0;i--) {
              const part=sim.particles[i];
              part.x+=part.vx*dt; part.y+=part.vy*dt; part.vy+=320*dt;
              part.vx*=Math.exp(-1.8*dt); part.rotation+=part.rotSpeed*dt;
              part.life-=dt/part.maxLife;
              if (part.life<=0) sim.particles.splice(i,1);
            }
            for (let i=sim.scorePopups.length-1;i>=0;i--) {
              const sp=sim.scorePopups[i];
              sp.y+=sp.vy*dt; sp.vy*=Math.exp(-2.5*dt); sp.life-=dt;
              if (sp.life<=0) sim.scorePopups.splice(i,1);
            }
          };

          // ── Draw Court ─────────────────────────────────────────────────────
          const drawCourt = () => {
            const W=sim.arenaW, H=sim.arenaH;
            const floorGrad=ctx.createLinearGradient(0,0,0,H);
            floorGrad.addColorStop(0,"#c8892a"); floorGrad.addColorStop(0.5,"#b87828"); floorGrad.addColorStop(1,"#a06820");
            ctx.fillStyle=floorGrad; ctx.fillRect(0,0,W,H);
            ctx.save();
            const plankW=Math.max(12,W/24);
            for (let x=0;x<W;x+=plankW) { ctx.fillStyle=Math.floor(x/plankW)%2===0?"rgba(255,210,140,0.09)":"rgba(0,0,0,0.07)"; ctx.fillRect(x,0,plankW,H); }
            ctx.restore();
            const sl=ctx.createRadialGradient(W*0.5,H*0.06,0,W*0.5,H*0.5,H*0.7);

              <div style={{padding:"24px 20px"}}>
                <div style={{fontSize:20,fontWeight:900,color:"#fff",marginBottom:4}}>JERSEY EDITOR</div>
                <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",marginBottom:16}}>Design your home & away kits</div>
                <div style={{display:"flex",gap:8,marginBottom:20}}>
                  {["HOME","AWAY"].map((k,i)=>(
                    <div key={k} style={{flex:1,textAlign:"center",padding:"10px",borderRadius:10,background:i===0?"rgba(0,212,255,0.15)":"rgba(255,255,255,0.05)",border:`1px solid ${i===0?"#00d4ff":"rgba(255,255,255,0.1)"}`,cursor:"pointer",fontSize:13,fontWeight:700,color:i===0?"#00d4ff":"rgba(255,255,255,0.5)"}}>{k}</div>
                  ))}
                </div>
                <div style={{textAlign:"center",marginBottom:20}}>
                  <div style={{width:100,height:130,margin:"0 auto",borderRadius:12,background:"linear-gradient(160deg,#1D428A,#0050cc)",border:"3px solid rgba(255,199,44,0.6)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>
                    <div style={{fontSize:42,fontWeight:900,color:"#FFC72C"}}>7</div>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",letterSpacing:2}}>UP</div>
                  </div>
                </div>
                {[
                  {label:"Primary Color",type:"color",val:"#1D428A"},
                  {label:"Secondary Color",type:"color",val:"#FFC72C"},
                  {label:"Jersey Number",type:"number"},
                  {label:"Player Name",type:"text"},
                ].map(f=>(
                  <div key={f.label} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                    <span style={{fontSize:14,color:"rgba(255,255,255,0.8)"}}>{f.label}</span>
                    {f.type==="color"
                      ? <input type="color" defaultValue={f.val} style={{width:36,height:36,borderRadius:8,border:"none",cursor:"pointer",background:"none"}}/>
                      : <input type={f.type} placeholder={f.type==="number"?"0–99":"Your name"} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"6px 12px",color:"#fff",fontSize:13,width:120}}/>
                    }
                  </div>
                ))}
                <div style={{marginTop:20,padding:"10px 16px 6px"}}>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>Pattern</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {["None","Pinstripes","Gradient","Side Panel","Camo"].map((p,i)=>(
                      <div key={p} style={{background:i===0?"rgba(0,212,255,0.15)":"rgba(255,255,255,0.05)",border:`1px solid ${i===0?"#00d4ff":"rgba(255,255,255,0.1)"}`,borderRadius:20,padding:"6px 14px",fontSize:12,color:i===0?"#00d4ff":"rgba(255,255,255,0.6)",cursor:"pointer"}}>{p}</div>
                    ))}
                  </div>
                </div>
              </div>
            );

            case "CUSTOMIZE": return (
              <div style={{padding:"24px 20px"}}>
                <div style={{fontSize:20,fontWeight:900,color:"#fff",marginBottom:4}}>CUSTOMIZE</div>
                <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",marginBottom:20}}>Build your stadium · Buy upgrades</div>
                {[
                  {label:"STADIUM PRESETS",items:[
                    {name:"The Palace",icon:"🏟️",cost:"Free"},
                    {name:"Neon City",icon:"🌆",cost:"20,000 🪙"},
                    {name:"Open Air",icon:"☀️",cost:"Free"},
                    {name:"Blackout",icon:"🖤",cost:"15,000 🪙"},
                    {name:"Retro Gym",icon:"🏫",cost:"Free"},
                  ]},
                  {label:"FLOOR",items:[
                    {name:"Hardwood Maple",icon:"🟫",cost:"Free"},
                    {name:"LED Panel",icon:"💡",cost:"25,000 🪙"},
                    {name:"Glass Floor",icon:"🔷",cost:"40,000 🪙"},
                  ]},
                  {label:"EFFECTS",items:[
                    {name:"Confetti Cannon",icon:"🎊",cost:"5,000 🪙"},
                    {name:"Pyro Entry",icon:"🔥",cost:"20,000 🪙"},
                    {name:"Smoke Machine",icon:"💨",cost:"12,000 🪙"},
                    {name:"Spotlight Shafts",icon:"🔦",cost:"30,000 🪙"},
                  ]},
                ].map(section=>(
                  <div key={section.label} style={{marginBottom:20}}>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>{section.label}</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {section.items.map((it,i)=>(
                        <div key={it.name} style={{background:i===0?"rgba(0,212,255,0.1)":"rgba(255,255,255,0.04)",border:`1px solid ${i===0?"rgba(0,212,255,0.4)":"rgba(255,255,255,0.1)"}`,borderRadius:14,padding:"12px 14px",cursor:"pointer",minWidth:110,textAlign:"center"}}>
                          <div style={{fontSize:24,marginBottom:4}}>{it.icon}</div>
                          <div style={{fontSize:12,fontWeight:700,color:i===0?"#00d4ff":"#fff"}}>{it.name}</div>
                          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:2}}>{it.cost}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            );

            case "SETTINGS": return (
              <div style={{padding:"24px 20px"}}>
                <div style={{fontSize:20,fontWeight:900,color:"#fff",marginBottom:20}}>SETTINGS</div>

                <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Audio</div>
                {toggle(sound, ()=>setSound(s=>!s), `Sound ${sound?"ON":"OFF"}`)}

                <div style={{marginTop:20,fontSize:11,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Gameplay</div>
                {toggle(autoDribble, ()=>setAutoDribble(d=>!d), `Auto-Dribble ${autoDribble?"ON":"OFF"}`)}

                <div style={{padding:"14px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <span style={{fontSize:15,color:"rgba(255,255,255,0.85)"}}>Shot Meter Shape</span>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {["Bar","Ring","Arrow","Diamond","Flame","Custom"].map(s=>(
                      <div key={s} onClick={()=>setMeterShape(s)} style={{background:meterShape===s?"rgba(0,212,255,0.2)":"rgba(255,255,255,0.06)",border:`1px solid ${meterShape===s?"#00d4ff":"rgba(255,255,255,0.12)"}`,borderRadius:20,padding:"6px 14px",fontSize:12,color:meterShape===s?"#00d4ff":"rgba(255,255,255,0.7)",cursor:"pointer"}}>{s}</div>
                    ))}
                  </div>
                </div>

                <div style={{marginTop:20,fontSize:11,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Language</div>
                <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"14px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"8px 12px"}}>
                    <span style={{fontSize:14}}>🔍</span>
                    <input value={langSearch} onChange={e=>setLangSearch(e.target.value)} placeholder="Search all languages..." style={{flex:1,background:"none",border:"none",outline:"none",color:"#fff",fontSize:13}}/>
                  </div>
                  <div style={{maxHeight:180,overflowY:"auto"}}>
                    {filteredLangs.map(l=>(
                      <div key={l} onClick={()=>{setLang(l);setLangSearch("");}} style={{padding:"8px 10px",borderRadius:8,cursor:"pointer",fontSize:13,color:lang===l?"#00d4ff":"rgba(255,255,255,0.7)",background:lang===l?"rgba(0,212,255,0.1)":"transparent",display:"flex",alignItems:"center",gap:8}}>
                        {lang===l && <span>●</span>}
                        {lang!==l && <span style={{color:"transparent"}}>●</span>}
                        {l}
                      </div>
                    ))}
                  </div>
                  <div style={{marginTop:8,fontSize:11,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>Current: {lang}</div>
                </div>

                <div style={{marginTop:20,fontSize:11,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>UpCoins</div>
                <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"16px"}}>
                  <div style={{fontSize:24,fontWeight:900,color:"#ffd700",marginBottom:4}}>🪙 {coins.toLocaleString()}</div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:14}}>Your balance</div>
                  <div style={{display:"flex",gap:8}}>
                    {COIN_PACKS.map(p=>(
                      <div key={p.id} onClick={()=>{ if(confirm(`Buy ${fmtCoins(p.coins)} UpCoins for ${p.price}?`)) setCoins(c=>c+p.coins); }} style={{flex:1,background:p.best?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.05)",border:`2px solid ${p.best?"#ffd700":"rgba(255,255,255,0.12)"}`,borderRadius:12,padding:"12px 8px",textAlign:"center",cursor:"pointer"}}>
                        <div style={{fontSize:14,fontWeight:800,color:p.best?"#ffd700":"#fff"}}>{p.label}</div>
                        <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",margin:"4px 0"}}>{fmtCoins(p.coins)} 🪙</div>
                        <div style={{fontSize:16,fontWeight:900,color:p.best?"#ffd700":"#00d4ff"}}>{p.price}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );

            default: return <div style={{padding:40,color:"rgba(255,255,255,0.5)"}}>Coming soon</div>;
          }
        };

        return (
          <div style={{height:"100dvh",display:"flex",flexDirection:"column",background:"#050814",color:"#fff",fontFamily:"Inter,system-ui,sans-serif",overflow:"hidden"}}>
            {/* Top bar */}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px",borderBottom:"1px solid rgba(255,255,255,0.08)",flexShrink:0,background:"rgba(5,8,20,0.95)",backdropFilter:"blur(12px)"}}>
              <div style={{fontSize:24,fontWeight:900,letterSpacing:4,background:"linear-gradient(90deg,#fff,#00d4ff)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>UP</div>
              <div style={{fontSize:14,fontWeight:700,color:"#ffd700"}}>🪙 {coins.toLocaleString()}</div>
            </div>
            {/* Tab bar */}
            <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid rgba(255,255,255,0.08)",flexShrink:0,background:"rgba(5,8,20,0.9)"}}>
              {TABS.map(t=>(
                <div key={t} onClick={()=>setTab(t)} style={{padding:"10px 16px",whiteSpace:"nowrap",cursor:"pointer",fontSize:11,fontWeight:700,letterSpacing:"0.06em",color:tab===t?"#00d4ff":"rgba(255,255,255,0.4)",borderBottom:`2px solid ${tab===t?"#00d4ff":"transparent"}`,transition:"color 0.15s",display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:70}}>
                  <span style={{fontSize:16}}>{TAB_ICONS[t]}</span>
                  <span>{t.replace(" ","\n")}</span>
                </div>
              ))}
            </div>
            {/* Tab content */}
            <div style={{flex:1,overflowY:"auto"}}>
              {renderTab()}
            </div>
          </div>
        );
      }

      // ─── App Root ────────────────────────────────────────────────────────────
      function App() {
        const [screen, setScreen] = useState<"home"|"game">("home");
        if (screen === "game") return <BasketballGame />;
        return <HomeScreen onPlay={()=>setScreen("game")} />;
      }

      // Mount
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
    <script>
      // Manually transpile and execute the game source after all CDN scripts are ready
      (function run() {
        var src = document.getElementById('game-source').textContent;
        var result = Babel.transform(src, {
          presets: ['react', 'typescript'],
          filename: 'game.tsx'
        });
        // eslint-disable-next-line no-new-func
        eval(result.code);
      })();
    </script>
  </body>
</html>
